services:
  # 1. FastAPI Python Backend Web Service
  - type: web
    name: studywise-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m app.core.init_db && python -m app.seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ALLOW_ALL_ORIGINS
        value: "true"

  # 2. React Vite Frontend Static Site
  - type: web
    name: studywise-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://studywise-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
