version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ALLOW_ALL_ORIGINS=true
    volumes:
      - ./backend/studywise.db:/app/studywise.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - backend
